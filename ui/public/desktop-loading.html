<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>叙事驾驶舱 · 启动中</title>
<style>
  html,body{height:100%;margin:0;background:#0d1117;color:#e6edf3;font:15px/1.7 "Segoe UI",system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .box{text-align:center}
  .mark{font-size:44px;color:#34d399;animation:pulse 1.4s ease-in-out infinite}
  h1{font-size:18px;font-weight:600;letter-spacing:.02em;margin:18px 0 6px}
  p{color:#8b949e;margin:0;font-size:13px}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="box">
  <div class="mark">◈</div>
  <h1>正在启动本地引擎</h1>
  <p>第一次启动需要解包运行时，请稍候…</p>
</div>
</body>
</html>
