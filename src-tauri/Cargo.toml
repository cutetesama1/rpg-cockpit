[package]
name = "rpg-cockpit"
version = "0.4.0"
description = "叙事驾驶舱 · 桌面外壳（Tauri + Python sidecar）"
authors = ["RPG Framework"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
